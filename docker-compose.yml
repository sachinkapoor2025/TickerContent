version: "3.9"
# Optional. Local default is PGlite (no Docker required).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticker
      POSTGRES_PASSWORD: ticker
      POSTGRES_DB: ticker_cms
    ports:
      - "5432:5432"
    volumes:
      - ticker_pg:/var/lib/postgresql/data
volumes:
  ticker_pg:
